schemaVersion: 1
id: simple-html-page-agent
name: Simple HTML Page Agent
version: 1.8.0
description: Builds simple standalone HTML page pieces with playful animated SVG illustrations from the user's first prompt onward.
author: Tangent
icon: icon.svg
tags:
  - html
  - web
  - svg
  - creative

prime:
  systemPrompt: prompts/prime.md
  welcomeMessage: prompts/welcome.md
  # System tools (trigger, memory, orchestration, session) are auto-granted to
  # every bundle's Prime; only declare the workspace tools this agent needs.
  tools:
    - read
    - write
    - edit
    - bash

skills:
  - skills/simple-html-pages/SKILL.md
