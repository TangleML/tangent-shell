schemaVersion: 1
id: tangle
name: Tangle
version: 1.1.0
description: A Tangle-aware assistant with the Tangent skill toolkit and Tangle API tools for everyday work with Tangle ML pipelines and runs.
author: Tangent
icon: icon.svg
tags:
  - tangle
  - ml

prime:
  systemPrompt: prompts/prime.md
  welcomeMessage: prompts/welcome.md
  tools:
    - read
    - write
    - edit
    - bash
    # Tangle API tools (tools/tangle-api.ts). Must be listed here or Pi's
    # --tools allowlist filters the extension-registered tools out.
    - tangle_run_list
    - tangle_run_status
    - tangle_run_submit
    - tangle_run_cancel
    - tangle_run_annotation_set
    - tangle_execution_state
    - tangle_execution_details
    - tangle_execution_logs
    - tangle_execution_artifacts
    - tangle_artifact_signed_url
    # Triggers
    - create_trigger
    - list_triggers
    - enable_trigger
    - disable_trigger
    - delete_trigger

subagents:
  defaultSystemPrompt: prompts/subagent.md

ui:
  components:
    - name: pipeline-progress
      kind: message
      entry: ui/pipeline-progress.tsx
