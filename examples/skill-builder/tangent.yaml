schemaVersion: 1
id: skill-builder
name: Skill Builder
version: 1.1.0
description: Author quality skills and package them into an installable Tangent Configuration Bundle zip.
author: Tangent
icon: icon.svg
tags:
  - skills
  - authoring
  - bundle

prime:
  systemPrompt: prompts/prime.md
  tools:
    - read
    - write
    - edit
    - bash
    - package_bundle

subagents:
  defaultSystemPrompt: prompts/subagent.md
  defaultTools:
    - read
    - grep
    - find
    - ls

skills:
  - skills/skill-authoring/SKILL.md
  - skills/bundle-assembly/SKILL.md
workflows:
  - workflows/new-skill-bundle.md
agents:
  - agents/skill-reviewer.md
memory:
  - memory/project-notes.md
extensions:
  - tools/package_bundle.ts

software:
  brew:
    - "zip"
  apk:
    - "zip"
  npm:
    - "fflate"
